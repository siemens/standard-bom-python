name: PyPI release
on:
    push:
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
    call-build-and-test-workflow:
        uses:
            ./.github/workflows/build-and-test.yml

    pypi-publish:
        name: Upload release to PyPI
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/siemens-standard-bom
        permissions:
            id-token: write
        needs: call-build-and-test-workflow
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up Poetry project
                uses: ./.github/actions/setup-poetry-project
                with:
                    python-version: '3.11'
                    install-args: --sync --no-interaction
            -   name: Package project
                run: |
                    poetry build
            -   name: Publish package to PyPI
                uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
                with:
                    packages-dir: dist
