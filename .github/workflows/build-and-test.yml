on:
    workflow_call

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15" ]
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up Poetry project
                uses: ./.github/actions/setup-poetry-project
                with:
                    python-version: ${{ matrix.python-version }}
            -   name: Build package
                run: |
                    poetry build
            -   name: Upload build artifacts
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: build-${{ matrix.python-version }}
                    path: |
                        dist/*.whl
                        dist/*.tar.gz

    tests:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        strategy:
            matrix:
                python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15" ]
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up Poetry project
                uses: ./.github/actions/setup-poetry-project
                with:
                    python-version: ${{ matrix.python-version }}
            -   name: Run the automated tests
                run: |
                    poetry run tox run -e ${{ matrix.python-version }}
            -   name: Upload coverage results
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: coverage-results-${{ matrix.python-version }}
                    path: coverage.xml

    coverage-badge:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        needs:
            - tests
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Download coverage artifact
                uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
                with:
                    name: coverage-results-3.15
            -   name: Run coverage badge
                run: |
                    sudo apt-get install xq
                    pip install anybadge==1.18.0
                    mkdir -p badges/
                    cov_value=$(xq --xpath "//coverage/@line-rate" coverage.xml)
                    cov_rounded=$(printf "%.1f\n" $(bc <<< "100*${cov_value}"))
                    echo "Coverage found: ${cov_rounded}%"
                    anybadge --label python:coverage --value ${cov_rounded} --suffix "%" --file badges/coverage-python.svg --overwrite
            -   uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
                with:
                    commit_message: "chore(docs): update coverage badge"
                    commit_user_name: "CI/CD Push Token"

    lint:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up Poetry project
                uses: ./.github/actions/setup-poetry-project
                with:
                    python-version: '3.15'
            -   name: Run the linting
                run: |
                    poetry run tox run -e lint,type
